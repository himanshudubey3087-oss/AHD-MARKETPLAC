<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login | AHD Marketplace</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<main class="auth-page">
    <section class="auth-card login-form-card">

        <!-- BRAND -->
        <div class="brand">
            <a href="home.html" style="text-decoration:none;">
                <div class="brand-logo">AHD</div>
            </a>
            <h1>Customer Login</h1>
            <p>Login to buy products, request deals and contact sellers</p>
        </div>

        <!-- LOGIN METHOD TOGGLE -->
        <div class="login-method-tabs">
            <button type="button" class="method-tab active" id="btnMethodPassword" onclick="switchLoginMethod('password')">
                🔑 Password Login
            </button>
            <button type="button" class="method-tab" id="btnMethodOtp" onclick="switchLoginMethod('otp')">
                📲 Mobile OTP Login
            </button>
        </div>

        <!-- PASSWORD FORM -->
        <form id="customerLoginForm" novalidate>
            <div class="input-group">
                <label for="customerEmail">Email or Mobile Number</label>
                <input
                    type="text"
                    id="customerEmail"
                    name="identifier"
                    placeholder="Enter email or 10-digit mobile"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="input-group">
                <div class="label-row">
                    <label for="customerPassword">Password</label>
                    <a href="forgot-password.html?from=customer" id="customerForgotPassword">
                        Forgot Password?
                    </a>
                </div>

                <div class="password-box">
                    <input
                        type="password"
                        id="customerPassword"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                    <button type="button" id="customerPasswordToggle" aria-label="Toggle password">
                        👁️
                    </button>
                </div>
            </div>

            <div id="customerLoginMessage" class="message" role="alert"></div>

            <button type="submit" class="primary-btn" id="customerLoginSubmit">
                Login as Customer
            </button>
        </form>

        <!-- PHONE OTP LOGIN FORM -->
        <form id="customerOtpLoginForm" style="display:none;" novalidate>
            <div class="input-group">
                <label for="customerOtpPhone">10-Digit Mobile Number</label>
                <div class="input-with-button">
                    <input
                        type="tel"
                        id="customerOtpPhone"
                        maxlength="10"
                        placeholder="e.g. 9876543210"
                        required
                    >
                    <button type="button" class="send-otp-btn" id="customerSendOtpBtn" onclick="requestLoginOtp('customer')">
                        📲 Send OTP
                    </button>
                </div>
            </div>

            <div class="input-group">
                <label for="customerLoginOtp">Enter 6-Digit OTP</label>
                <input
                    type="text"
                    id="customerLoginOtp"
                    class="otp-digit-input"
                    maxlength="6"
                    inputmode="numeric"
                    placeholder="• • • • • •"
                    required
                >
            </div>

            <div id="customerOtpLoginMessage" class="message" role="alert"></div>

            <button type="submit" class="primary-btn" id="customerOtpLoginSubmit">
                Verify OTP & Login
            </button>
        </form>

        <!-- QUICK 1-CLICK DEMO HELPER -->
        <div class="demo-box">
            <div class="demo-box-title">⚡ Instant Testing</div>
            <div class="demo-buttons">
                <button type="button" class="demo-pill-btn" onclick="quickFillAndLogin('customer')">
                    👤 Fill & Login Demo Customer
                </button>
            </div>
        </div>

        <div class="divider">
            <span>OR</span>
        </div>

        <button type="button" class="secondary-btn" id="customerCreateAccount">
            Create Customer Account
        </button>

        <p class="signup-text">
            Want to sell something?
            <a href="seller-login.html">Seller Login</a>
        </p>

        <button type="button" class="back-home" id="customerBackHome">
            ← Continue without Login
        </button>

    </section>
</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>

</body>
</html>
