<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AHD - Forgot Password</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forgot-password.css">
</head>

<body>

<header class="forgot-header">
    <a href="home.html" class="ahd-logo">AHD</a>

    <div class="header-title">
        Forgot Password
    </div>
</header>


<main class="forgot-container">

    <section class="forgot-card">

        <div class="forgot-icon">
            🔐
        </div>

        <h1>Reset Your Password</h1>

        <p class="forgot-subtitle">
            Enter your registered mobile number to reset your password.
        </p>


        <!-- STEP 1 : PHONE -->

        <div id="phoneStep" class="forgot-step">

            <label for="phoneNumber">
                Mobile Number
            </label>

            <input
                type="tel"
                id="phoneNumber"
                maxlength="10"
                placeholder="Enter registered mobile number"
                autocomplete="tel"
            >

            <button
                type="button"
                id="sendOtpButton"
                class="primary-btn"
            >
                Send OTP
            </button>

        </div>


        <!-- STEP 2 : OTP -->

        <div
            id="otpStep"
            class="forgot-step"
            style="display:none;"
        >

            <label for="otp">
                Enter OTP
            </label>

            <input
                type="text"
                id="otp"
                maxlength="6"
                placeholder="Enter 6 digit OTP"
                inputmode="numeric"
                autocomplete="one-time-code"
            >

            <p class="demo-otp">
                Demo OTP: <strong>123456</strong>
            </p>

            <button
                type="button"
                id="verifyOtpButton"
                class="primary-btn"
            >
                Verify OTP
            </button>

        </div>


        <!-- STEP 3 : NEW PASSWORD -->

        <div
            id="passwordStep"
            class="forgot-step"
            style="display:none;"
        >

            <label for="newPassword">
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                autocomplete="new-password"
            >


            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                autocomplete="new-password"
            >


            <button
                type="button"
                id="resetPasswordButton"
                class="primary-btn"
            >
                Reset Password
            </button>

        </div>


        <div
            id="forgotMessage"
            class="message"
        ></div>


        <div class="back-login">
            <a href="customer-login.html">
                ← Back to Login
            </a>
        </div>

    </section>

</main>


<footer class="forgot-footer">
    © 2026 AHD Marketplace
</footer>


<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/forgot-password.js"></script>

</body>
</html>
