<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | AHD Marketplace</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/signup.css">
</head>
<body>

<main class="auth-page">
    <section class="auth-card">

        <div class="brand">
            <a href="home.html" style="text-decoration:none;">
                <div class="brand-logo">AHD</div>
            </a>
            <h1>Create Account</h1>
            <p>Join AHD Marketplace — Buy, Sell & Deal locally</p>
        </div>

        <div class="section-title">
            <h2>Select Account Type</h2>
            <p>Choose how you want to use AHD Marketplace</p>
        </div>

        <div class="account-options">
            <!-- CUSTOMER -->
            <button type="button" class="account-option" id="customerSignupButton">
                <div class="option-icon">👤</div>
                <div class="option-content">
                    <strong>Customer Account</strong>
                    <span>Buy products, post deal requests, and hire local service professionals</span>
                </div>
                <div class="option-arrow">→</div>
            </button>

            <!-- SELLER -->
            <button type="button" class="account-option" id="sellerSignupButton">
                <div class="option-icon seller-icon">🏪</div>
                <div class="option-content">
                    <strong>Seller Account</strong>
                    <span>List your items, manage inquiries, match with buyers, and grow your business</span>
                </div>
                <div class="option-arrow">→</div>
            </button>
        </div>

        <div class="login-text">
            <span>Already have an account?</span>
            <a href="login.html">Login</a>
        </div>

        <button type="button" class="back-button" id="backHomeButton">
            ← Back to Home
        </button>

    </section>
</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/signup.js"></script>

</body>
</html>
